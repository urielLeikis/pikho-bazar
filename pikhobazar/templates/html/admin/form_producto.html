{% extends "html/index.html" %} 

{% block content %}
<div class="container mt-5">
    <h2>{% if producto %} Editar Producto {% else %} Nuevo Producto {% endif %}</h2>
    <hr>
    
    <form method="POST" class="shadow p-4 bg-light rounded">
        {% csrf_token %} 
        
        <div class="mb-3">
            <label class="form-label">Código del Producto:</label>
            <input type="text" name="codigo" class="form-control" 
                value="{{ producto.codigo|default:'' }}" 
                {% if producto %}readonly{% endif %} required>
            <small class="text-muted">El código debe ser único (ej: SH4046MI).</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción:</label>
            <input type="text" name="descripcion" class="form-control" 
                value="{{ producto.descripcion|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio de Venta:</label>
            <input type="number" step="0.01" name="precio_venta" class="form-control" 
                value="{{ producto.precio_venta|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Observaciones:</label>
            <textarea name="observaciones" class="form-control">{{ producto.observaciones|default:'' }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success">Guardar Cambios</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
